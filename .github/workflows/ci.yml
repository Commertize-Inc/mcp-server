# CI for the Commertize Agents MCP server.
#
# Runs the same hermetic suites the agents run locally (`npm test` =
# tsc build + test/run-all.mjs, which includes the language/wording guard;
# the live api.commertize.com suite stays opt-in and is NOT enabled here),
# plus `npm run typecheck`. Suites start stub servers on 127.0.0.1 only.
#
# No secrets, no deploy, read-only token. Actions pinned by full commit SHA.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # package.json engines: node >=20.10; 22 is the active LTS line.
          node-version: "22"
          cache: npm

      - name: Install (frozen lockfile)
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Test (build + hermetic suites + wording guard)
        env:
          COMMERTIZE_MCP_LIVE_TESTS: "0"
        run: npm test
